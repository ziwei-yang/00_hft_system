# HFT Shared Memory Test Configuration
# All test segments have "test." prefix
#
# Note: Set hugepage_size = "0" or "none" to disable hugepages for testing
# In production, use "2MB" or "1GB" (requires hugepages configured in kernel)

[test.mktdata.binance.raw.rx]
type = "ringbuffer"
capacity = "32MB"
element_size = 1
codec = "string/json"
hugepage_size = "0"

[test.mktdata.binance.raw.tx]
type = "ringbuffer"
capacity = "2MB"
element_size = 1
codec = "string/json"
hugepage_size = "0"

[test.orderbook.binance.btcusdt]
type = "snapshot"
capacity = "1MB"
element_size = 64
codec = "binary"
hugepage_size = "0"

[test.signals.alpha]
type = "ringbuffer"
capacity = "512KB"
element_size = 128
codec = "binary"
hugepage_size = "0"
